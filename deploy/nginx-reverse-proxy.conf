# LlamaStream — Reverse Proxy (HTTPS) example
# Replace llamastream.apbs.link with your domain.
# Point proxy_pass ports to your docker-compose host ports (default 3000 frontend, 3001 backend).

# ── RECOMMENDED: single domain, API on /api (no mixed content, no CORS issues) ──
server {
    listen 443 ssl http2;
    server_name llamastream.apbs.link;

    # ssl_certificate     /etc/letsencrypt/live/llamastream.apbs.link/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/llamastream.apbs.link/privkey.pem;

    client_max_body_size 20M;

    # Frontend (React PWA)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name llamastream.apbs.link;
    return 301 https://$host$request_uri;
}

# ── ALTERNATIVE: separate API subdomain (must use HTTPS on API too!) ──
